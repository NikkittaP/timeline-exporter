# iOS: Shared.xcframework -> XcodeGen project -> simulator tests -> signed
# .ipa -> TestFlight. Laid out as NEARCOIL's ios.yml: cheap checks on Linux
# first (preflight), the macOS job only after they pass.
#   validate    shared JVM tests, then on macOS: shared simulator tests, the
#               xcframework, XcodeGen, an unsigned device build and the
#               XCTests on the simulator. No secrets needed.
#   build       the same checks and simulator tests, then a signed .ipa
#               (artifact, 3 days). Secrets: APPLE_TEAM_ID, IOS_BUNDLE_ID,
#               IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64,
#               IOS_DISTRIBUTION_CERTIFICATE_PASSWORD,
#               IOS_PROVISIONING_PROFILE_BASE64.
#   testflight  build, then the .ipa is uploaded to App Store Connect and the
#               run waits for TestFlight processing. Secrets: those of build
#               plus APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_PRIVATE_KEY.
#               Runs only from master.
# Uploaded builds are never submitted for review and never sent to external
# testers: they only appear in TestFlight -> Builds.
# Runs by hand (Actions -> iOS -> Run workflow) and, in validate mode, on
# pushes to master that touch the iOS side. Free: the repository is public.
# Job logs need a GitHub login; failures are also written as annotations
# (tools/ci_annotate.py and ::error lines), readable through the public
# check-runs API. Secrets, build numbers, troubleshooting: docs/IOS_BUILD.md.
name: iOS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate - checks, unsigned build, simulator tests; build - signed .ipa; testflight - .ipa to TestFlight (master only)"
        type: choice
        options: [validate, build, testflight]
        default: validate
      build_number:
        description: "CFBundleVersion. Empty - YYMMDD.HHMMSS.attempt in UTC (always grows, checked against App Store Connect)"
        type: string
        required: false
  push:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "tools/ci_annotate.py"
      - "tools/test_ci_annotate.py"
      - "tools/ios/**"
      - "shared/build.gradle.kts"
      - "shared/src/**"

permissions:
  contents: read

# A running iOS build is never cancelled: an App Store Connect upload cut
# halfway is worse than a queue. At most one run waits behind it: a newer
# pending run replaces an older pending one.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pushes have no inputs: they validate.
  MODE: ${{ inputs.mode || 'validate' }}
  # The runner image's Xcode must be this major; another fails the run.
  XCODE_MAJOR: "27"
  # Not secrets (visible in any build): a guard against a typo in the
  # APPLE_TEAM_ID / IOS_BUNDLE_ID secrets. Logs mask secret values as ***,
  # and these strings too, since they equal them.
  EXPECTED_APPLE_TEAM_ID: 87H7UW6D73
  EXPECTED_IOS_BUNDLE_ID: com.nikitapetrovapps.timelineexporter

jobs:
  preflight:
    name: Preflight (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      build_base: ${{ steps.number.outputs.build_base }}
      build_auto: ${{ steps.number.outputs.build_auto }}
      marketing_version: ${{ steps.version.outputs.marketing_version }}
    steps:
      - name: Trusted ref check
        if: env.MODE == 'testflight' && github.ref != 'refs/heads/master'
        run: |
          # Workflow-command escaping: % first, then CR dropped and LF as %0A.
          ref="$(printf '%s' "$GITHUB_REF" | python3 -c 'import sys; print(sys.stdin.read().strip().replace("%", "%25").replace(chr(13), "").replace(chr(10), "%0A"))')"
          echo "::error title=testflight::testflight runs only from master (requested: $ref)"
          exit 1

      # Only "set / not set": the values never reach this environment.
      - name: Required secrets
        env:
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID != '' }}
          HAS_IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 != '' }}
          HAS_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD != '' }}
          HAS_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID != '' }}
          HAS_APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID != '' }}
          HAS_APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          echo "Mode: $MODE"
          need=()
          if [[ "$MODE" != validate ]]; then
            need+=(APPLE_TEAM_ID IOS_BUNDLE_ID IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64
                   IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64)
          fi
          if [[ "$MODE" == testflight ]]; then
            need+=(APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY)
          fi
          if [[ ${#need[@]} -eq 0 ]]; then
            echo "validate needs no secrets."
            exit 0
          fi
          missing=0
          for s in "${need[@]}"; do
            v="HAS_$s"
            if [[ "${!v}" == true ]]; then
              echo "  ok       $s"
            else
              echo "  MISSING  $s"
              echo "::error title=Missing secret::$s (Settings -> Secrets and variables -> Actions)"
              missing=1
            fi
          done
          if [[ $missing == 1 ]]; then
            echo "ERROR: add the missing repository secrets (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every mode, no secret needed: the IDs the project builds with are the
      # ones the secrets below (and the provisioning profile) are checked against.
      - name: Project IDs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          spec = open("ios/project.yml", encoding="utf-8").read()
          def values(key):
              return [v.strip().strip("\"'") for v in
                      re.findall(rf"^\s*{key}:\s*(\S+)\s*$", spec, re.M)]
          team, bundle = os.environ["EXPECTED_APPLE_TEAM_ID"], os.environ["EXPECTED_IOS_BUNDLE_ID"]
          errors = []
          teams = values("DEVELOPMENT_TEAM")
          if not teams or any(t != team for t in teams):
              errors.append(f"DEVELOPMENT_TEAM in ios/project.yml is {teams or 'missing'}, "
                            f"the workflow expects {team} (EXPECTED_APPLE_TEAM_ID)")
          ids = values("PRODUCT_BUNDLE_IDENTIFIER")
          # The app's ID, and the test bundle's below it (<app>.tests).
          if bundle not in ids or any(i != bundle and not i.startswith(bundle + ".") for i in ids):
              errors.append(f"PRODUCT_BUNDLE_IDENTIFIER in ios/project.yml is {ids or 'missing'}, "
                            f"the workflow expects {bundle} (EXPECTED_IOS_BUNDLE_ID)")
          for e in errors:
              print(f"ERROR: {e}")
              print(f"::error title=Project IDs::{e}")
          if errors:
              sys.exit(1)
          print(f"ios/project.yml: team {team}, bundle {bundle}")
          PY

      # Values never printed: only which secret differs.
      - name: Secrets match the project
        if: env.MODE != 'validate'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          bad=0
          if [[ "$APPLE_TEAM_ID" != "$EXPECTED_APPLE_TEAM_ID" ]]; then
            echo "::error title=Secrets::secret APPLE_TEAM_ID differs from EXPECTED_APPLE_TEAM_ID in ios.yml"
            bad=1
          fi
          if [[ "$IOS_BUNDLE_ID" != "$EXPECTED_IOS_BUNDLE_ID" ]]; then
            echo "::error title=Secrets::secret IOS_BUNDLE_ID differs from EXPECTED_IOS_BUNDLE_ID in ios.yml"
            bad=1
          fi
          [[ $bad == 0 ]] || exit 1
          echo "APPLE_TEAM_ID and IOS_BUNDLE_ID match the project."

      - name: Marketing version
        id: version
        run: |
          set -euo pipefail
          mapfile -t found < <(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^"[:space:]]*)"?[[:space:]]*$/\1/p' ios/project.yml)
          if [[ ${#found[@]} -ne 1 ]]; then
            echo "::error title=Marketing version::expected one MARKETING_VERSION in ios/project.yml, found ${#found[@]}"
            exit 1
          fi
          v="${found[0]}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            shown="$(printf '%s' "$v" | python3 -c 'import sys; print(sys.stdin.read().strip().replace("%", "%25").replace(chr(13), "").replace(chr(10), "%0A"))')"
            echo "::error title=Marketing version::MARKETING_VERSION '$shown' in ios/project.yml is not X.Y.Z"
            exit 1
          fi
          echo "Marketing version (CFBundleShortVersionString): $v"
          echo "marketing_version=$v" >> "$GITHUB_OUTPUT"

      # Build number: YYMMDD.HHMMSS.attempt, UTC start time of the run.
      # App Store Connect compares the parts as numbers, so:
      #  - every run is above the previous one (time only grows;
      #    github.run_number would reset if the workflow were renamed);
      #  - "Re-run failed jobs" does not repeat a number: preflight is not
      #    re-run then, but the iOS job takes the new attempt
      #    (github.run_attempt) and the number comes out higher;
      #  - two runs at once are impossible (concurrency).
      # The leading zero of HHMMSS is dropped (090512 -> 90512): same numeric
      # order, and "integer without leading zeros" is unambiguous for Apple.
      # Before the upload the number is also checked against App Store
      # Connect (tools/ios/asc_builds.py).
      - name: Build number
        id: number
        env:
          REQUESTED: ${{ inputs.build_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED" ]]; then
            base="$REQUESTED"; auto=false; n="$REQUESTED"
          else
            read -r day time <<< "$(date -u '+%y%m%d %H%M%S')"
            base="$day.$((10#$time))"; auto=true; n="$base.$ATTEMPT"
          fi
          if ! out="$(python3 tools/ios/asc_builds.py format "$n" 2>&1)"; then
            echo "$out"
            # The number may come from the input: escaped for the workflow command.
            msg="$(printf '%s' "$out" | sed 's/^ERROR: //' | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace(chr(13), "").replace(chr(10), "%0A"))')"
            echo "::error title=Build number::$msg"
            exit 1
          fi
          echo "$out"
          {
            echo "build_base=$base"
            echo "build_auto=$auto"
            echo "build_number=$n"
          } >> "$GITHUB_OUTPUT"

      # Read-only: the number is new to App Store Connect and above every
      # number of this version. Here, so no macOS minutes go to a build Apple
      # would reject anyway.
      - name: Build number vs App Store Connect (read-only)
        if: env.MODE == 'testflight'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.number.outputs.build_number }}
        run: |
          set -uo pipefail
          # ERROR lines may carry App Store Connect's text: escaped for the
          # workflow command (% first, then CR dropped and LF as %0A).
          esc() { python3 -c 'import sys; print(sys.stdin.read().strip().replace("%", "%25").replace(chr(13), "").replace(chr(10), "%0A"))'; }
          python3 tools/ios/asc_builds.py check --version "$VERSION" --build "$BUILD_NUMBER" 2>&1 \
            | tee "$RUNNER_TEMP/asc-check.log"
          rc=${PIPESTATUS[0]}
          if [[ $rc != 0 ]]; then
            msg="$(sed -n 's/^ERROR: //p' "$RUNNER_TEMP/asc-check.log" | head -n 3 | esc)"
            echo "::error title=Build number vs App Store Connect::${msg:-asc_builds.py check failed (exit $rc)}"
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Before Gradle, so Failure annotations (gated on gradle.log) does not
      # cover it: the step names the failing test script itself.
      - name: CI script tests
        run: |
          set -euo pipefail
          trap 'echo "::error title=CI script tests::$BASH_COMMAND failed"' ERR
          python3 tools/test_ci_annotate.py
          python3 tools/ios/test_simulator_udid.py
          python3 tools/ios/test_make_app_icon.py
          python3 tools/ios/test_asc_builds.py
          python3 tools/ios/test_check_ipa.py

      - name: Shared tests (JVM)
        run: |
          set -euo pipefail
          ./gradlew :shared:jvmTest --stacktrace 2>&1 | tee gradle.log

      # Logs need a GitHub login; annotations are public (check-runs API).
      # Only once Gradle has run: every earlier step writes its own ::error.
      - name: Failure annotations
        if: failure() && hashFiles('tools/ci_annotate.py') != '' && hashFiles('gradle.log') != ''
        run: python3 tools/ci_annotate.py gradle.log shared/build/test-results

  ios:
    name: iOS (${{ inputs.mode || 'validate' }})
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 75
    outputs:
      build_number: ${{ steps.number.outputs.build_number }}
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      # The attempt of this job, not of preflight (see Build number there).
      BUILD_NUMBER: ${{ needs.preflight.outputs.build_auto == 'true' && format('{0}.{1}', needs.preflight.outputs.build_base, github.run_attempt) || needs.preflight.outputs.build_base }}
      MARKETING_VERSION: ${{ needs.preflight.outputs.marketing_version }}
      BUILD_DIR: ${{ github.workspace }}/build/ios
      LOGS: ${{ github.workspace }}/build/ios/logs
    steps:
      - name: Build number
        id: number
        run: |
          echo "Version ${MARKETING_VERSION}, build ${BUILD_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      # No fallback Xcode: if the image serves another major, failing beats
      # silently building with a toolchain nobody checked. The notice makes the
      # versions readable without a login.
      - name: Toolchain
        run: |
          set -euo pipefail
          xcode="$(xcodebuild -version | sed -n 1p)"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "::notice title=Toolchain::$xcode, iphonesimulator SDK $sdk, macOS $(sw_vers -productVersion), $(uname -m)"
          if [[ "$(uname -m)" != arm64 ]]; then
            echo "::error title=Runner::expected an Apple Silicon (arm64) runner, got $(uname -m)"
            exit 1
          fi
          if [[ ! "$xcode" =~ ^Xcode\ ${XCODE_MAJOR}(\.|$) ]]; then
            echo "::error title=Xcode version::runner provides '$xcode', the workflow expects Xcode ${XCODE_MAJOR}"
            exit 1
          fi
          if ! device_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"; then
            echo "::error title=iphoneos SDK::this runner image has no iphoneos SDK"
            exit 1
          fi
          {
            echo "XCODE_VERSION=$(xcodebuild -version | tr '\n' ' ')"
            echo "IPHONEOS_SDK=$device_sdk"
            echo "MACOS_VERSION=$(sw_vers -productVersion)"
          } >> "$GITHUB_ENV"

      # checkout empties the workspace, so $LOGS is created after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Signing before Gradle: a broken certificate or a wrong profile shows
      # up in a minute, not after the build. tools/ios/signing.sh annotates.
      - name: Signing
        if: env.MODE != 'validate'
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash tools/ios/signing.sh

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Shared simulator tests + Shared.xcframework
        run: |
          set -euo pipefail
          mkdir -p "$LOGS"
          ./gradlew :shared:iosSimulatorArm64Test :shared:assembleSharedReleaseXCFramework --stacktrace 2>&1 | tee gradle.log
          ls shared/build/XCFrameworks/release/Shared.xcframework || {
            echo "::error title=Shared.xcframework::not found at shared/build/XCFrameworks/release after a successful Gradle run"
            exit 1; }

      - name: XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          mkdir -p "$LOGS"
          command -v xcodegen >/dev/null || brew install xcodegen || {
            echo "::error title=XcodeGen install::brew install xcodegen failed"
            exit 1; }
          xcodegen --version
          log="$LOGS/xcodegen.log"
          if ! (cd ios && xcodegen generate) > "$log" 2>&1; then
            cat "$log"
            # Workflow-command escaping: % first, then CR dropped and LF as %0A.
            msg="$(tail -n 15 "$log" | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace(chr(13), "").replace(chr(10), "%0A"))')"
            echo "::error title=XcodeGen::$msg"
            exit 1
          fi
          cat "$log"

      # Proves the device slice links without signing (validate only; build
      # and testflight prove it with the signed archive). Never becomes an .ipa.
      # The full log goes to $LOGS; the step shows errors and the tail on
      # failure, warnings and the result line on success.
      - name: Unsigned device build
        if: env.MODE == 'validate'
        run: |
          set -euo pipefail
          mkdir -p "$LOGS"
          log="$LOGS/xcodebuild-device.log"
          cd ios
          if ! xcodebuild build -project TimelineExporter.xcodeproj -scheme TimelineExporter \
              -configuration Release -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO > "$log" 2>&1; then
            grep -E "error:|\*\* BUILD" "$log" | head -n 60 || true
            echo "--- last 30 lines of $log ---"
            tail -n 30 "$log"
            exit 1
          fi
          grep -E "warning:|\*\* BUILD" "$log" || true

      # Every mode: a signed build must not ship untested code.
      - name: Simulator tests
        run: |
          set -euo pipefail
          mkdir -p "$LOGS"
          log="$LOGS/xcodebuild-test.log"
          # Never pick a runtime newer than the Xcode's SDK.
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          udid="$(xcrun simctl list devices available -j | python3 tools/ios/simulator_udid.py "$sdk")" || {
            echo "::error title=Simulator::could not pick an iPhone simulator (simctl or tools/ios/simulator_udid.py failed, see the log)"
            exit 1; }
          echo "Simulator: $udid"
          cd ios
          if ! xcodebuild test -project TimelineExporter.xcodeproj -scheme TimelineExporter \
              -configuration Debug -destination "platform=iOS Simulator,id=$udid" \
              -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
              CODE_SIGNING_ALLOWED=NO > "$log" 2>&1; then
            grep -E "error:|Test Case .* failed|\*\* TEST" "$log" | head -n 60 || true
            echo "--- last 30 lines of $log ---"
            tail -n 30 "$log"
            exit 1
          fi
          grep -E "Test Case .*(passed|failed)|Executed|\*\* TEST" "$log" || true

      # tools/ios/build_ipa.sh annotates its own failures.
      - name: Archive and export IPA
        if: env.MODE != 'validate'
        run: |
          set -euo pipefail
          mkdir -p "$LOGS"
          bash tools/ios/build_ipa.sh "$BUILD_DIR" archive
          mv "$BUILD_DIR/ipa/TimelineExporter.ipa" \
             "$BUILD_DIR/ipa/TimelineExporter-iOS-${MARKETING_VERSION}-${BUILD_NUMBER}.ipa"

      - name: Check IPA
        if: env.MODE != 'validate'
        run: >
          python3 tools/ios/check_ipa.py "$BUILD_DIR"/ipa/*.ipa
          --bundle-id "$EXPECTED_IOS_BUNDLE_ID"
          --version "$MARKETING_VERSION"
          --build "$BUILD_NUMBER"

      # The .ipa only: no .p12, .p8 or keychain is in build/ios/ipa (they live
      # in $RUNNER_TEMP). The embedded.mobileprovision inside the .ipa is in
      # every App Store app and is not a secret.
      - name: Upload IPA artifact
        if: env.MODE != 'validate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TimelineExporter-iOS-${{ env.MARKETING_VERSION }}-${{ env.BUILD_NUMBER }}
          path: build/ios/ipa/*.ipa
          retention-days: 3
          if-no-files-found: error

      - name: Upload to App Store Connect (TestFlight)
        if: env.MODE == 'testflight'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          # ERROR lines may carry App Store Connect's text: escaped for the
          # workflow command (% first, then CR dropped and LF as %0A).
          esc() { python3 -c 'import sys; print(sys.stdin.read().strip().replace("%", "%25").replace(chr(13), "").replace(chr(10), "%0A"))'; }
          # Once more right before the upload: something may have appeared in
          # App Store Connect during the build, and "Re-run failed jobs" does
          # not re-run preflight with its check. Read-only.
          if ! python3 tools/ios/asc_builds.py check --version "$MARKETING_VERSION" --build "$BUILD_NUMBER" \
              > "$RUNNER_TEMP/asc-check.log" 2>&1; then
            cat "$RUNNER_TEMP/asc-check.log"
            msg="$(sed -n 's/^ERROR: //p' "$RUNNER_TEMP/asc-check.log" | head -n 3 | esc)"
            echo "::error title=Build number vs App Store Connect::${msg:-asc_builds.py check failed}"
            exit 1
          fi
          cat "$RUNNER_TEMP/asc-check.log"
          # build_ipa.sh annotates its own failures.
          bash tools/ios/build_ipa.sh "$BUILD_DIR" upload

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Timeline Exporter iOS - ${MODE}: ${JOB_STATUS}"
            echo "| | |"
            echo "|---|---|"
            echo "| Version (CFBundleShortVersionString) | ${MARKETING_VERSION:-?} |"
            echo "| Build (CFBundleVersion) | ${BUILD_NUMBER:-?} |"
            echo "| Xcode | ${XCODE_VERSION:-?} |"
            echo "| iphoneos SDK | ${IPHONEOS_SDK:-?} |"
            echo "| macOS | ${MACOS_VERSION:-?} |"
            if [[ "$MODE" == testflight && "$JOB_STATUS" == success ]]; then
              echo ""
              echo "Uploaded to App Store Connect. Not submitted for review, not sent to external testers."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=iOS ${MODE}::version ${MARKETING_VERSION:-?}, build ${BUILD_NUMBER:-?}, ${JOB_STATUS}"

      # Logs need a GitHub login; annotations are public (check-runs API).
      # Only once Gradle has run (gradle.log is written even when it fails):
      # every earlier step (Toolchain, Signing) writes its own ::error, and
      # every xcodebuild step comes after Gradle. Logs that are missing or
      # ended in success add nothing.
      - name: Failure annotations
        if: failure() && hashFiles('tools/ci_annotate.py') != '' && hashFiles('gradle.log') != ''
        run: >
          python3 tools/ci_annotate.py gradle.log shared/build/test-results
          --xcodebuild "$LOGS/xcodebuild-device.log"
          --xcodebuild "$LOGS/xcodebuild-test.log"
          --xcodebuild "$LOGS/xcodebuild-archive.log"
          --xcodebuild "$LOGS/xcodebuild-export.log"
          --xcodebuild "$LOGS/xcodebuild-upload.log"

      # Logs only. No signing material in build/ios/logs: it is in $RUNNER_TEMP.
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-logs
          path: |
            build/ios/logs/
            ${{ runner.temp }}/tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

      # Last, after success and failure alike. Skipped only when the run
      # stopped before checkout: then no signing material was installed.
      - name: Remove signing material
        if: always() && hashFiles('tools/ios/cleanup.sh') != ''
        run: bash tools/ios/cleanup.sh

  # App Store Connect processing takes minutes; waiting for it on macOS would
  # mean paying for idle time. Waits on Linux, read-only. Job-level if: no
  # env here, and inputs.mode is empty (not testflight) on push.
  testflight-status:
    name: TestFlight processing
    needs: [preflight, ios]
    if: inputs.mode == 'testflight'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for App Store Connect processing (read-only)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          VERSION: ${{ needs.preflight.outputs.marketing_version }}
          BUILD_NUMBER: ${{ needs.ios.outputs.build_number }}
        run: |
          set -uo pipefail
          # ERROR lines may carry App Store Connect's text: escaped for the
          # workflow command (% first, then CR dropped and LF as %0A).
          esc() { python3 -c 'import sys; print(sys.stdin.read().strip().replace("%", "%25").replace(chr(13), "").replace(chr(10), "%0A"))'; }
          python3 tools/ios/asc_builds.py wait --version "$VERSION" --build "$BUILD_NUMBER" --minutes 20 2>&1 \
            | tee "$RUNNER_TEMP/asc-wait.log"
          rc=${PIPESTATUS[0]}
          if [[ $rc != 0 ]]; then
            msg="$(sed -n 's/^ERROR: //p' "$RUNNER_TEMP/asc-wait.log" | head -n 3 | esc)"
            echo "::error title=TestFlight processing::${msg:-asc_builds.py wait failed (exit $rc)}"
            exit 1
          fi
