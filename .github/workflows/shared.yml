# Shared core checks. Free on a public repository; macOS only for the iOS compile and tests.
name: shared

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM tests + Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :shared:jvmTest :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee gradle.log
      # Logs need a GitHub login; annotations are public (check-runs API).
      - if: failure()
        run: python3 tools/ci_annotate.py gradle.log shared/build/test-results app/build/test-results

  ios:
    name: iOS compile + simulator tests
    needs: jvm
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :shared:iosSimulatorArm64Test :shared:linkReleaseFrameworkIosArm64 --stacktrace 2>&1 | tee gradle.log
      # Logs need a GitHub login; annotations are public (check-runs API).
      - if: failure()
        run: python3 tools/ci_annotate.py gradle.log shared/build/test-results
