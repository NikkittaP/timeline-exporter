# XcodeGen spec of the iOS app. The .xcodeproj is generated (`xcodegen generate`
# in ios/) and not committed. Needs shared/build/XCFrameworks/release/Shared.xcframework
# (./gradlew :shared:assembleSharedReleaseXCFramework). Built only in CI:
# .github/workflows/ios.yml. Signing comes from CI (tools/ios/build_ipa.sh).
name: TimelineExporter
options:
  bundleIdPrefix: com.nikitapetrovapps
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 87H7UW6D73
    # Swift 5 language mode: the Kotlin framework's types are not Sendable,
    # and strict concurrency would flag every hop to a background task.
    SWIFT_VERSION: "5.0"
    # Shared.xcframework has an arm64 simulator slice only (Apple silicon).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  # The map. Metal-based, so none of the old-Adreno trouble that pins the
  # Android MapLibre at 11.8.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
targets:
  TimelineExporter:
    type: application
    platform: iOS
    sources:
      - path: TimelineExporter
      # The map styles are the Android app's, used as they are.
      - path: ../app/src/main/assets/map_style_light.json
        buildPhase: resources
      - path: ../app/src/main/assets/map_style_dark.json
        buildPhase: resources
      # The demo history: "Try it with sample data" on the first screen (for
      # users and App Review, who have no Timeline of their own) and the store
      # screenshots (ScreenshotMode). The Android screenshot test's own file.
      - path: ../app/src/androidTest/assets/timeline_demo.json
        buildPhase: resources
    # Merged with the generated keys (GENERATE_INFOPLIST_FILE): what has no
    # INFOPLIST_KEY_ build setting. Written by xcodegen, not committed.
    info:
      path: Generated/TimelineExporter-Info.plist
      properties:
        # Timeline.json opens in the app from Files and share sheets.
        CFBundleDocumentTypes:
          - CFBundleTypeName: JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
        LSSupportsOpeningDocumentsInPlace: true
        # The languages of Localizable.xcstrings (tools/ios/strings_to_xcstrings.py).
        CFBundleLocalizations: [en, ar, de, es, fr, hi, it, ja, ko, nl, pl, pt-BR, ru, sv, tr, uk, zh-Hans, zh-Hant]
    dependencies:
      # Static Kotlin/Native framework: linked, not embedded.
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        embed: false
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikitapetrovapps.timelineexporter
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Kotlin/Native static frameworks need the C++ runtime from the app's link.
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timeline Exporter
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The share sheet offers Save Image for the Map image. The English
        # fallback; the translations are Resources/InfoPlist.xcstrings.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Saves the map images you choose to save to your photo library."
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  TimelineExporterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TimelineExporterTests
    dependencies:
      - target: TimelineExporter
      # Visible to the compiler (the app's module imports Shared), never linked:
      # the app already carries the one copy of the Kotlin runtime.
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikitapetrovapps.timelineexporter.tests
        # Finds module Shared, which the app's swiftmodule imports; never links it.
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(BUILT_PRODUCTS_DIR)"]
        GENERATE_INFOPLIST_FILE: YES
  # Store screenshots only (.github/workflows/ios-screens.yml): launches the
  # app once per scene and language and writes each shot as a PNG.
  TimelineExporterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TimelineExporterUITests
    dependencies:
      - target: TimelineExporter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikitapetrovapps.timelineexporter.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TimelineExporter
schemes:
  # Not in the TimelineExporter scheme's tests: ios.yml runs that on every push.
  StoreScreenshots:
    build:
      targets:
        TimelineExporter: all
        TimelineExporterUITests: [test]
    test:
      config: Debug
      targets:
        - TimelineExporterUITests
  TimelineExporter:
    build:
      targets:
        TimelineExporter: all
        TimelineExporterTests: [test]
    test:
      config: Debug
      targets:
        - TimelineExporterTests
