# XcodeGen spec of the iOS app. The .xcodeproj is generated (`xcodegen generate`
# in ios/) and not committed. Needs shared/build/XCFrameworks/release/Shared.xcframework
# (./gradlew :shared:assembleSharedReleaseXCFramework). Built only in CI:
# .github/workflows/ios.yml. Signing arrives in stage 2.
name: TimelineExporter
options:
  bundleIdPrefix: com.nikitapetrovapps
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 87H7UW6D73
    SWIFT_VERSION: "6.0"
    # Shared.xcframework has an arm64 simulator slice only (Apple silicon).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  TimelineExporter:
    type: application
    platform: iOS
    sources:
      - path: TimelineExporter
    dependencies:
      # Static Kotlin/Native framework: linked, not embedded.
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikitapetrovapps.timelineexporter
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Kotlin/Native static frameworks need the C++ runtime from the app's link.
        OTHER_LDFLAGS: ["-lc++"]
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timeline Exporter
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  TimelineExporterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TimelineExporterTests
    dependencies:
      - target: TimelineExporter
      # Visible to the compiler (the app's module imports Shared), never linked:
      # the app already carries the one copy of the Kotlin runtime.
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikitapetrovapps.timelineexporter.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TimelineExporter:
    build:
      targets:
        TimelineExporter: all
        TimelineExporterTests: [test]
    test:
      config: Debug
      targets:
        - TimelineExporterTests
